# Alembic settings. Keep this file ASCII-only: on Windows Alembic reads it
# in the system code page, and Cyrillic comments break the parser.
# The database URL comes from the DATABASE_URL environment variable,
# falling back to sqlalchemy.url below (see migrations/env.py).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# File names like 0002_add_users.py (pass the number with --rev-id 0002).
file_template = %%(rev)s_%%(slug)s
path_separator = os
sqlalchemy.url = sqlite:///./app.db

[post_write_hooks]
# Every new migration goes through ruff right away, so lab 3 checks stay green.
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
