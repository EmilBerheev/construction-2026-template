[project]
name = "course-project"
version = "0.1.0"
description = "Курсовой проект по «Конструированию ПО». Замените описание на своё."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20",
    "argon2-cffi>=25.1",
    "fastapi>=0.162",
    "sqlalchemy>=2.1",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "pyyaml>=6.0",
    "ruff>=0.17",
    "schemathesis>=4.33",
    "types-pyyaml>=6.0",
]
# Драйвер PostgreSQL: нужен в CI (проверка миграций) и если вы запускаете PostgreSQL сами.
pg = ["psycopg[binary]>=3.3"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

# --- Качество кода (ЛР3) ---------------------------------------------------

[tool.ruff]
line-length = 100
extend-exclude = ["grader"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "C90", "RUF"]
# RUF001–RUF003 считают кириллицу «похожей на латиницу». Для русскоязычного проекта это шум.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
files = ["src"]

# --- Тесты ------------------------------------------------------------------

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["contract: контрактные тесты по OpenAPI (Schemathesis)"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# --- Автопроверка -------------------------------------------------------------
# Грейдер читает эти настройки. Меняйте, только если переименовали пакет или приложение.

[tool.grader]
package = "app"
asgi_app = "app.api.main:app"
